[project]
name = "blockology-gvi"
version = "0.1.0"
description = "VLM-driven blockology pipeline for measuring pedestrian-perspective green view (GVI) and visual enclosure (VEI) from Street View imagery."
readme = "README.md"
authors = [
    { email = "atelier.j.l@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "contextily>=1.7.1",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=4.11.0",
    "osmnx>=2.1.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
]

[project.scripts]
blockology-gvi = "blockology_gvi:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
