[project]
name = "blockology-gvi"
version = "0.1.0"
description = "VLM-driven blockology pipeline for measuring pedestrian-perspective green view (GVI) and visual enclosure (VEI) from Street View imagery."
readme = "README.md"
authors = [
    { email = "atelier.j.l@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contextily>=1.7.1",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python-headless>=4.11.0",
    "osmnx>=2.1.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
colab = [
    "google-colab-cli>=0.6.0",
    # google-colab-cli's PyPI wheel doesn't pin jupyter-kernel-client, so a
    # plain install resolves PyPI's datalayer/jupyter-kernel-client (renamed
    # its KernelClient class to JupyterKernelClient in a later release)
    # instead of googlecolab's own fork (same import name, kept the old
    # KernelClient API google-colab-cli's code actually calls) --
    # AttributeError: 'jupyter_kernel_client' has no attribute
    # 'KernelClient' otherwise. Listed directly (not just pulled in
    # transitively by google-colab-cli) because uv only applies
    # [tool.uv.sources] overrides to direct project dependencies.
    "jupyter-kernel-client",
]

[tool.uv.sources]
jupyter-kernel-client = { git = "https://github.com/googlecolab/jupyter-kernel-client.git" }
